[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "institutional-marl-trading"
version = "0.1.0"
description = "Institutional grade multi-agent RL trading platform MVP"
authors = [{name = "OpenAI"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.2",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "httpx==0.27.0",
    "numpy==1.26.4",
    "pandas==2.2.1",
    "dvc==3.45.0",
    "mlflow==2.11.3",
    "stable-baselines3==2.3.2",
    "gymnasium==0.29.1",
    "torch==2.2.1",
    "vectorbt==0.26.6",
    "scikit-learn==1.4.1.post1",
    "matplotlib==3.8.4",
    "prometheus-client==0.20.0",
    "pyyaml==6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-mock==3.12.0",
    "ruff==0.3.5"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
