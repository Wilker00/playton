version: "3.10"
services:
  api:
    build: .
    environment:
      - ENV=dev
      - API_SECRET_KEY=super-secret-change-me
      - API_ALLOWED_ORIGINS=http://localhost:5173
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    environment:
      - MLFLOW_TRACKING_URI=http://0.0.0.0:5000
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:///mlflow.db", "--default-artifact-root", "/mlruns"]
    volumes:
      - mlflow-data:/mlruns
    ports:
      - "5000:5000"
volumes:
  mlflow-data:
